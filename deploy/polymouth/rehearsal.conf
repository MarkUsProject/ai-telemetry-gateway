# Rehearsal settings: a throwaway copy of the gateway in Mateo's own folder,
# backed by a throwaway Postgres on port 5434. Delete it all after the run:
#   ./trial-pg.sh rehearsal.conf destroy
#   rm -rf /data/otelcol/aitg-rehearsal
#
# Starts from staging.conf, then overrides the settings that differ.
# shellcheck disable=SC2034  # settings are read by the scripts that source this file

# shellcheck source=/dev/null
source "$(dirname "${BASH_SOURCE[0]}")/staging.conf"

INSTALL_DIR=/data/otelcol/aitg-rehearsal
MODEL_CONFIG=config.rehearsal.yaml

# trial-pg.sh runs a disposable cluster here, outside INSTALL_DIR.
TRIAL_PG_DIR=/data/otelcol/aitg-trial-pg
PG_PORT=5434

# Test budgets. smoke-test.sh funds its own course row, so these leave the
# test calls room to run.
COURSE_IDS=1
COURSE_BUDGET_CAD=10.00
COURSE_ALERT_CAD=8.00
TERM_BUDGET_CAD=100.00
