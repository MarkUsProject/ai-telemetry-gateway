# Staging settings for the gateway on polymouth. Secrets go to
# ${INSTALL_DIR}/secrets.env instead (make-secrets.sh writes them).
#
# Fill in every CHANGE_ME before running install.sh. The scripts stop on any
# setting left at CHANGE_ME.
# shellcheck disable=SC2034  # settings are read by the scripts that source this file

# ---------- Layout ----------
# Dean creates this folder (mateo:autotst, mode 2750) in Email 1.
INSTALL_DIR=/data/ai-telemetry-gateway
# The service runs as this user. Matches markus-ai-server on polymouth.
SERVICE_USER=autotst
# polymouth's Python. LiteLLM supports >=3.10,<3.15 (PyPI metadata).
PYTHON=/local/bin/python3.13
# Pin the exact LiteLLM release the gateway hooks were tested against.
# Find it on the local stack: docker compose exec litellm pip show litellm
LITELLM_VERSION=1.100.1

# ---------- Network ----------
# Loopback listener. Apache on :443 forwards two routes here (Email 2, step 3).
LISTEN_HOST=127.0.0.1
# 4001, not LiteLLM's default 4000: on a busy 4000, LiteLLM jumps to a random
# port (proxy_cli.py), which Apache misses. On a busy 4001 it exits,
# and daemontools retries.
LISTEN_PORT=4001

# ---------- Postgres ----------
# polymouth's own Postgres 16 (/service/pgsql).
PG_HOST=127.0.0.1
PG_PORT=5432
PG_DB=aitg

# ---------- Gateway behaviour ----------
# Model list copied to app/config.yaml. config.yaml holds the paid models.
MODEL_CONFIG=config.yaml
# Gatekeeper cap on max_tokens per call (the gateway's default).
MAX_TOKENS_CEILING=4096

# ---------- Budgets (CAD) ----------
# All ben staging instances share this host name, so the gateway sees one
# instance. Fund courses from one ben instance at a time.
MARKUS_INSTANCE=ben.teach.cs.toronto.edu
# Comma-separated MarkUs Course.id values to fund. test250 courses 1,2,3 send
# tests to charlotte (staging plan, "Autotester findings").
COURSE_IDS=1,2,3
COURSE_BUDGET_CAD=10.00
# Spend at which the instructor alert fires. Must sit below COURSE_BUDGET_CAD.
COURSE_ALERT_CAD=8.00

# One period covers the whole staging window.
PERIOD_CODE=staging_2026
PERIOD_NAME="Staging 2026-27"
PERIOD_START="2026-10-01 00:00:00"
PERIOD_END="2027-04-30 23:59:59"
TERM_BUDGET_CAD=30.00
